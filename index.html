<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Lista de Tareas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Botón para volver al portafolios principal -->
    <a href="https://vilcheslinense4.github.io/Mi-primer-portafolios/" style="
        display: inline-block;
        padding: 10px 20px;
        background-color: #2d3748;
        color: white;
        text-decoration: none;
        border-radius: 30px;
        margin: 20px;
        font-family: sans-serif;
        font-weight: bold;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    ">⬅ Volver al Portafolios</a>

    <div class="contenedor">
        <h2>Mi Lista de Tareas</h2>
        <div class="input-group">
            <input type="text" id="tareaInput" placeholder="Ej: Aprender JavaScript...">
            <button id="botonAñadir">Añadir</button>
        </div>
        <ul id="listaTareas"></ul>
    </div>

    <script src="script.js"></script>

</html>
